[project]
name = "pikpak-tool"
version = "0.1.0"
description = "rclone 기반 PikPak 통합 도구 (download / rename / scan / delete / purge / clean)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pikpak-tool = "pikpak_tool.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 원본 사용법 docstring(탭 정렬 예시)을 그대로 보존
"src/pikpak_tool/__init__.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
